; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATtiny1614]
platform = atmelmegaavr
board = ATtiny1614
framework = arduino

; SerialUPDI Settings (The CLI logic we mastered)
upload_protocol = serialupdi
upload_speed = 230400
upload_port = /dev/cu.wchusbserial14530

; Monitor Settings (Replaces the 'screen' command)
monitor_speed = 115200
monitor_port = /dev/cu.wchusbserial14530

; Ensure we are using the megaTinyCore version of the tools
board_fuses.eesave = yes